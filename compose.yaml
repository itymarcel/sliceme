services:
  slicer-api:
    restart: unless-stopped
    build:
      context: ./services/slicer
      args:
        ORCA_RUNTIME_IMAGE: ${ORCA_RUNTIME_IMAGE:-ghcr.io/itymarcel/custom-orca:dev-arm64}
    environment:
      SLICER_CONCURRENCY: ${SLICER_CONCURRENCY:-1}
      SLICER_TIMEOUT_SECONDS: ${SLICER_TIMEOUT_SECONDS:-700}
      SLICER_MAX_FILE_BYTES: ${SLICER_MAX_FILE_BYTES:-209715200}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_SLICER_MODEL: ${OPENAI_SLICER_MODEL:-gpt-5.4}
      OPENAI_TIMEOUT_SECONDS: ${OPENAI_TIMEOUT_SECONDS:-90}
      OPENAI_PREFILL_CONCURRENCY: ${OPENAI_PREFILL_CONCURRENCY:-2}
      OPENAI_PREFILL_RATE_LIMIT: ${OPENAI_PREFILL_RATE_LIMIT:-10}
      OPENAI_PREFILL_RATE_WINDOW_SECONDS: ${OPENAI_PREFILL_RATE_WINDOW_SECONDS:-600}
    expose:
      - "8080"
    init: true

  web:
    restart: unless-stopped
    build: ./apps/web
    environment:
      SLICER_API_HOST: ${SLICER_API_HOST:-slicer-api}
      SLICER_API_PORT: ${SLICER_API_PORT:-8080}
    depends_on:
      - slicer-api
    ports:
      - "3007:80"
