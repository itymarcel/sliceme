services:
  slicer-api:
    build:
      context: ./services/slicer
      args:
        ORCA_RUNTIME_IMAGE: ${ORCA_RUNTIME_IMAGE:-ghcr.io/itymarcel/custom-orca:main-arm64}
    environment:
      SLICER_CONCURRENCY: ${SLICER_CONCURRENCY:-1}
      SLICER_TIMEOUT_SECONDS: ${SLICER_TIMEOUT_SECONDS:-700}
      SLICER_MAX_FILE_BYTES: ${SLICER_MAX_FILE_BYTES:-209715200}
    expose:
      - "8080"
    init: true

  web:
    build: ./apps/web
    environment:
      SLICER_API_HOST: ${SLICER_API_HOST:-slicer-api}
      SLICER_API_PORT: ${SLICER_API_PORT:-8080}
    depends_on:
      - slicer-api
    ports:
      - "3007:80"
