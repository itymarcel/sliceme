name: Focused feature proposal
description: Propose a bounded workflow improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the print-preparation problem before proposing UI or implementation details.
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: Current workaround
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
    validations:
      required: true
  - type: input
    id: references
    attributes:
      label: Relevant examples or references
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: I searched existing issues and the roadmap.
          required: true
        - label: This proposal does not include secrets or private models.
          required: true
